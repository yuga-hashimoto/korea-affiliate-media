name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: https://preview.invalid
          SITE_INDEXING_ENABLED: "false"
        run: pnpm build
      - name: Upload build trace (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-logs
          path: |
            .next/trace
            npm-debug.log
          if-no-files-found: ignore

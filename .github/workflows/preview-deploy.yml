name: Preview Deploy (Vercel)

# Preview環境へのデプロイ。
# VERCEL_TOKEN が未設定の場合は何もせずスキップする（安全なデフォルト）。
# 本番ドメイン（sougakuhikaku.com）への切替は行わない。本番は明示承認後に別途。

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check configuration
        if: env.VERCEL_TOKEN == ''
        run: |
          echo "::notice::VERCEL_TOKEN が未設定のため Preview デプロイをスキップしました。docs/PREVIEW_DEPLOY.md を参照してください。"

      - uses: actions/checkout@v5
        if: env.VERCEL_TOKEN != ''

      - uses: pnpm/action-setup@v4
        if: env.VERCEL_TOKEN != ''

      - uses: actions/setup-node@v5
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: env.VERCEL_TOKEN != ''
        run: pnpm install --frozen-lockfile

      - name: Deploy preview
        if: env.VERCEL_TOKEN != ''
        id: deploy
        run: |
          npx --yes vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --token="$VERCEL_TOKEN"
          url=$(npx --yes vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url"

      - name: Comment preview URL
        if: env.VERCEL_TOKEN != '' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.deploy.outputs.url }}";
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Preview deploy: ${url}\n\n- この環境は \`SITE_INDEXING_ENABLED=false\`（noindex）です。\n- サンプル価格の表示は \`NEXT_PUBLIC_DEMO_MODE\` で制御します。`
            });
